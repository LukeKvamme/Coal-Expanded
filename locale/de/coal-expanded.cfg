CE_Anthracite=Anthrazit
CE_Diamond=Diamant


[item-description]
CE_Lignite=Braunkohle (Lignit) ist ein weiches, braunes, brennbares Sedimentgestein, das aus natürlich verdichtetem Torf entsteht. Sie enthält etwa 25–35 % Kohlenstoff und gilt wegen ihres relativ geringen Heizwerts als die niedrigste Kohlesorte.
CE_Sub-Bituminous_Coal=Hartbraunkohle (subbituminöse Kohle) ist eine geringwertige Kohle mit 35–45 % Kohlenstoff. Ihre Eigenschaften liegen zwischen denen der Braunkohle, der niedrigsten Kohlesorte, und denen der Steinkohle, der zweithöchsten Kohlesorte.
CE_Bituminous_Coal=Steinkohle (bituminöse Kohle) ist eine mittlere Kohlesorte zwischen Hartbraunkohle und Anthrazit. Sie hat meist einen hohen Heizwert und wird zur Stromerzeugung und Stahlherstellung verwendet.
CE_Anthracite=Anthrazit ist eine harte, kompakte Kohlesorte mit halbmetallischem Glanz. Sie hat den höchsten Kohlenstoffgehalt, die wenigsten Verunreinigungen und die höchste Energiedichte aller Kohlesorten und ist damit die hochwertigste Kohle.
CE_Diamond=Diamant ist eine feste Form des Elements Kohlenstoff, dessen Atome in einer kubischen Kristallstruktur, dem Diamantgitter, angeordnet sind.

