[mod-setting-name]
coal-extended-base-fuel-value=Basis-Brennwert pro Kohle (MJ)
coal-extended-compression-ratio=Items pro Verdichtungsstufe
coal-extended-energy-factor=Faktor Energiebonus
coal-extended-speed-factor=Faktor Geschwindigkeitsbonus für Fahrzeuge
coal-extended-stack-size=Stapelgröße

[mod-setting-description]
coal-extended-base-fuel-value=Brennwert einer Kohle in MJ, aus dem der [font=default-semibold][color=255,255,0]Brennwert[/color][/font] der verdichteten Kohlesorten berechnet wird. Normale Kohle hat 4 MJ, Werte über 4 erzeugen beim Verdichten zusätzliche Energie.\nErlaubt: 4–40, Standard: 4.
coal-extended-compression-ratio=Wie viele Items zu einem Item der nächsten Stufe [font=default-semibold][color=255,255,0]zusammengefügt[/color][/font] werden. Der Brennwert ändert sich entsprechend.\nErlaubt: 5–100, Standard: 10.
coal-extended-energy-factor=Multiplikator für den [font=default-semibold][color=255,255,0]Brennwert[/color][/font] der verdichteten Kohlesorten (zwei Nachkommastellen). Der Bonus steigt linear pro Stufe, Diamant erhält den vollen Faktor.\nBeispiel 2,00: Braunkohle +20 %, Hartbraunkohle +40 %, … Diamant +100 %.\nErlaubt: 1,00–2,00, Standard: 1,00 (kein Bonus).
coal-extended-speed-factor=Multiplikator für [font=default-semibold][color=255,255,0]Beschleunigung und Höchstgeschwindigkeit[/color][/font] von Fahrzeugen mit verdichteter Kohle als Brennstoff (zwei Nachkommastellen). Steigt wie der Energiebonus linear pro Stufe.\nErlaubt: 1,00–2,00, Standard: 1,00 (kein Bonus).
coal-extended-stack-size=[font=default-semibold][color=255,255,0]Stapelgröße[/color][/font] von Kohle und allen verdichteten Kohlesorten.\nErlaubt: 50–1000, Standard: 50.
