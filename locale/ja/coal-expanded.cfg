[item-name]
CE_Lignite=褐炭（ライグナイト）
CE_Sub-Bituminous_Coal=亜無煙炭（亜軽質石炭）
CE_Bituminous_Coal=無煙炭（軽質石炭）
CE_Anthracite=無煙炭（無煙石炭）
CE_Diamond=ダイヤモンド

[item-description]
CE_Lignite=褐炭（ライグナイト）は、茶色の軟らかい堆積岩で、天然に圧縮された泥炭から形成されます。炭素含有量は約25～35％であり、比較的低い熱量を持つため、石炭の中でも最もランクが低いとされています。
CE_Sub-Bituminous_Coal=亜無煙炭（亜軽質石炭）は炭素含有量が35～45％の低品位の石炭です。このタイプの特性は、最も品位の低い褐炭と、2番目に高い品位の無煙炭の間に位置します。
CE_Bituminous_Coal=無煙炭（軽質石炭）は、亜無煙炭と無煙石炭の間に位置する中位のランクの石炭です。無煙炭は通常高い熱量（Btu）を持ち、アメリカでは発電や鉄鋼製造に使用されています。
CE_Anthracite=無煙炭（無煙石炭）は、硬くてコンパクトな石炭で、半金属光沢を持っています。これは全ての種類の石炭の中で最も炭素含有量が高く、不純物が最も少なく、エネルギー密度が最も高いため、最もランクが高い石炭です。
CE_Diamond=ダイヤモンドは、炭素の元素の固体形態であり、その原子がダイヤモンド結晶構造に配列されています。

[mod-setting-name]
coal-extended-base-fuel-value=石炭1個あたりの基本燃料値（MJ）
coal-extended-compression-ratio=圧縮1段階あたりのアイテム数
coal-extended-energy-factor=エネルギーボーナス係数
coal-extended-speed-factor=乗り物速度ボーナス係数
coal-extended-stack-size=スタックサイズ

[mod-setting-description]
coal-extended-base-fuel-value=圧縮石炭の[font=default-semibold][color=255,255,0]燃料値[/color][/font]の計算に使う、石炭1個あたりの燃料値（MJ）です。バニラの石炭は4 MJで、4より大きい値では圧縮時にエネルギーが増えます。\n範囲：4～40、初期値：4
coal-extended-compression-ratio=次の段階のアイテム1個に[font=default-semibold][color=255,255,0]まとめる[/color][/font]アイテムの数です。燃料値もそれに応じて変わります。\n範囲：5～100、初期値：10
coal-extended-energy-factor=圧縮石炭の[font=default-semibold][color=255,255,0]燃料値[/color][/font]に掛ける係数です（小数点以下2桁）。ボーナスは段階ごとに直線的に増え、ダイヤモンドで係数の全量になります。\n例 2.00：褐炭 +20 %、亜無煙炭 +40 %、…、ダイヤモンド +100 %\n範囲：1.00～2.00、初期値：1.00（ボーナスなし）
coal-extended-speed-factor=圧縮石炭を燃料とする乗り物の[font=default-semibold][color=255,255,0]加速と最高速度[/color][/font]に掛ける係数です（小数点以下2桁）。エネルギーボーナスと同様に段階ごとに直線的に増えます。\n範囲：1.00～2.00、初期値：1.00（ボーナスなし）
coal-extended-stack-size=石炭とすべての圧縮石炭の[font=default-semibold][color=255,255,0]スタックサイズ[/color][/font]です。\n範囲：50～1000、初期値：50
