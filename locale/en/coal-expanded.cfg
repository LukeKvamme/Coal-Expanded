[mod-setting-name]
coal-extended-base-fuel-value=Base fuel value per coal (MJ)
coal-extended-compression-ratio=Items per compression step
coal-extended-energy-factor=Energy bonus factor
coal-extended-speed-factor=Vehicle speed bonus factor
coal-extended-stack-size=Stack size

[mod-setting-description]
coal-extended-base-fuel-value=Fuel value of one coal in MJ, used to calculate the [font=default-semibold][color=255,255,0]fuel value[/color][/font] of the compressed coal types. Vanilla coal has 4 MJ, values above 4 add energy when compressing.\nAllowed: 4–40, default: 4.
coal-extended-compression-ratio=How many items are [font=default-semibold][color=255,255,0]combined[/color][/font] into one item of the next tier. The fuel value scales accordingly.\nAllowed: 5–100, default: 10.
coal-extended-energy-factor=Multiplier for the [font=default-semibold][color=255,255,0]fuel value[/color][/font] of the compressed coal types (two decimals). The bonus grows linearly per tier, Diamond gets the full factor.\nExample 2.00: Lignite +20 %, Sub-Bituminous Coal +40 %, … Diamond +100 %.\nAllowed: 1.00–2.00, default: 1.00 (no bonus).
coal-extended-speed-factor=Multiplier for vehicle [font=default-semibold][color=255,255,0]acceleration and top speed[/color][/font] when using compressed coal types as fuel (two decimals). Grows linearly per tier like the energy bonus.\nAllowed: 1.00–2.00, default: 1.00 (no bonus).
coal-extended-stack-size=[font=default-semibold][color=255,255,0]Stack size[/color][/font] of coal and all compressed coal types.\nAllowed: 50–1000, default: 50.
