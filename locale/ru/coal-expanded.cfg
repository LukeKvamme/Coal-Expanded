[item-name]
CE_Lignite=Лигнит
CE_Sub-Bituminous_Coal=Суббитуминозный уголь
CE_Bituminous_Coal=Битуминозный уголь
CE_Anthracite=Антрацит
CE_Diamond=Алмаз


[item-description]
CE_Lignite=Также часто называемый «бурый уголь», лигнит — мягкая горючая осадочная порода бурого цвета, формирующаяся в естественных условиях под высоким давлением и температурой. В залежах бурого угля часто встречаются необуглившиеся ветки и даже стволы деревьев. Содержит от 25 до 35% углерода и считается самым низким сортом угля из-за его низкой теплоотдачи и быстрого сгорания.
CE_Sub-Bituminous_Coal=Суббитуминозный уголь — низкий сорт угля с содержанием углерода около 35-45%. Горючие свойства находятся примерно посредине между лигнитом, самым худшим типом угля, и битуминозным углём — углём среднего качества.
CE_Bituminous_Coal=Битуминозный уголь — это уголь среднего качества, горючие свойства находятся между суббитуминозным углём и высококачественным антрацитом. Используется во многих странах как основной источник топлива для электростианций и при выплавке высококачественной стали.
CE_Anthracite=Антрацит, также известный как каменный уголь — твёрдая, плотная разновидность угля с небольшим металлическим блеском. Содержит самый высокий среди углей процент углерода и наименьшее количество примесей и обладает наибольшей теплоёмкостью, а потому считается углём высшего сорта.
CE_Diamond=Алмаз — твёрдая кристаллическая форма углерода, под высочайшими давлением и температурой его атомы формируют кристаллическую решётку, называемую кубической. Из-за особенностей свей кристаллической решётки является самым твёрдым веществом в мире.

[mod-setting-name]
coal-extended-base-fuel-value=Базовая энергия одного угля (МДж)
coal-extended-compression-ratio=Предметов на ступень упаковки
coal-extended-energy-factor=Множитель бонуса энергии
coal-extended-speed-factor=Множитель бонуса скорости
coal-extended-stack-size=Размер стопки

[mod-setting-description]
coal-extended-base-fuel-value=Энергия одного угля в МДж, из которой рассчитывается [font=default-semibold][color=255,255,0]энергия[/color][/font] упакованных видов угля. У обычного угля 4 МДж, значения выше 4 добавляют энергию при упаковке.\nДопустимо: 4–40, по умолчанию: 4.
coal-extended-compression-ratio=Сколько предметов [font=default-semibold][color=255,255,0]объединяется[/color][/font] в один предмет следующей ступени. Энергия меняется соответственно.\nДопустимо: 5–100, по умолчанию: 10.
coal-extended-energy-factor=Множитель [font=default-semibold][color=255,255,0]энергии[/color][/font] упакованных видов угля (два знака после запятой). Бонус растёт линейно с каждой ступенью, алмаз получает полный множитель.\nПример 2.00: лигнит +20 %, суббитуминозный уголь +40 %, … алмаз +100 %.\nДопустимо: 1.00–2.00, по умолчанию: 1.00 (без бонуса).
coal-extended-speed-factor=Множитель [font=default-semibold][color=255,255,0]ускорения и максимальной скорости[/color][/font] транспорта на упакованном угле (два знака после запятой). Растёт линейно с каждой ступенью, как бонус энергии.\nДопустимо: 1.00–2.00, по умолчанию: 1.00 (без бонуса).
coal-extended-stack-size=[font=default-semibold][color=255,255,0]Размер стопки[/color][/font] угля и всех упакованных видов угля.\nДопустимо: 50–1000, по умолчанию: 50.
